spring:
  application:
    name: medicine-reminder
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medreminder}
    username: ${DB_USER:medreminder}
    password: ${DB_PASSWORD:medreminder}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET}         # required, at least 32 characters
    ttl: ${JWT_TTL:7d}
    issuer: medicine-reminder
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:10}
    paths:
      - /api/auth/login
      - /api/auth/register
      - /api/pairing

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    # Keep SQL and request bodies out of logs: they may contain health data.
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
