spring:
  application:
    name: medicine-reminder
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medreminder}
    username: ${DB_USER:medreminder}
    password: ${DB_PASSWORD:medreminder}
    # DATABASE_URL (postgresql://user:pass@host/db) also works; see DatabaseUrlEnvironment.
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:10}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}   # ms
      keepalive-time: ${DB_KEEPALIVE:120000}   # ms; 0 lets a sleeping database (Neon free) stay asleep
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  messages:
    basename: i18n/messages      # push alert text, one file per language; English is the fallback
    fallback-to-system-locale: false
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET}         # required, at least 32 characters
    ttl: ${JWT_TTL:7d}
    issuer: medicine-reminder
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:10}
    paths:
      - /api/auth/login
      - /api/auth/register
      - /api/pairing
  push:
    credentials-file: ${FIREBASE_CREDENTIALS:}   # service-account JSON; empty = push messages off
    app-url: ${APP_URL:http://localhost:5173}     # links in family alerts
  jobs:
    enabled: true
    missed-grace-minutes: 2   # wait this long after the automatic stop for the phone's own report
    interval: ${MISSED_CHECK_INTERVAL:PT1M}   # how often the server checks; the phone reports its own misses

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    # Keep SQL and request bodies out of logs: they may contain health data.
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
